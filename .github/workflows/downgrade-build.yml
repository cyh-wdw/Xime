name: Downgrade Build (Android 8)
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Lower minSdk to 26
        run: |
          sed -i -E 's/minSdk\s*=\s*28/minSdk = 26/' app/build.gradle.kts
          sed -i -E 's/minSdk\s*=\s*28/minSdk = 26/' plugin-core/build.gradle.kts
          echo "--- app ---"
          grep -n "minSdk" app/build.gradle.kts
          echo "--- plugin-core ---"
          grep -n "minSdk" plugin-core/build.gradle.kts

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xime-android8-apk
          path: app/build/outputs/apk/release/*.apk
